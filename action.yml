name: 'Deployment Guard'
description: 'Deterministic risk score for every deployment. Blocks risky deploys based on diff, Kubernetes changes and scanner findings.'
author: 'PantevoSystems'

branding:
  icon: 'shield'
  color: 'blue'

inputs:
  api-key:
    description: 'Deployment Guard API key (from pantevosystems.com/signup). Required — the step fails when it is empty.'
    required: true
  api-url:
    description: 'Deployment Guard API base URL (must be https://)'
    required: false
    default: 'https://api.pantevosystems.com'
  fail-open:
    description: "Default 'true': only outages (network error/timeout, HTTP 429, HTTP 5xx, or an invalid body on HTTP 200) print a warning and the deployment continues. Set 'false' to fail closed. Every other HTTP status (redirects, 401/402/403/404/413/422, ...) always fails."
    required: false
    default: 'true'
  fail-on-blocked:
    description: "Fail the pipeline when the status is BLOCKED ('true' or 'false', anything else fails the step)"
    required: false
    default: 'true'
  incidents-last-7d:
    description: 'Number of production incidents in the last 7 days'
    required: false
    default: '0'
  incidents-last-30d:
    description: 'Number of production incidents in the last 30 days'
    required: false
    default: '0'
  trivy-critical-cves:
    description: 'Number of CRITICAL CVEs reported by Trivy'
    required: false
    default: '0'
  trivy-high-cves:
    description: 'Number of HIGH CVEs reported by Trivy'
    required: false
    default: '0'
  semgrep-findings:
    description: 'Total number of Semgrep findings'
    required: false
    default: '0'
  semgrep-high-severity:
    description: 'Number of HIGH-severity Semgrep findings (subset of semgrep-findings)'
    required: false
    default: '0'
  checkov-failed-checks:
    description: 'Total number of failed Checkov checks'
    required: false
    default: '0'
  checkov-critical-failures:
    description: 'Number of CRITICAL Checkov failures (subset of checkov-failed-checks)'
    required: false
    default: '0'
  diff-changed-paths:
    description: 'Comma-separated list of changed file paths (auto-detected when empty)'
    required: false
    default: ''

outputs:
  score:
    description: 'Risk score (0-100)'
    value: ${{ steps.analyze.outputs.score }}
  verdict:
    description: 'Verdict (LOW RISK / MEDIUM RISK / HIGH RISK / CRITICAL RISK)'
    value: ${{ steps.analyze.outputs.verdict }}
  status:
    description: 'Status (PASS / WARN / BLOCKED). Decided by the API using the thresholds from your dashboard.'
    value: ${{ steps.analyze.outputs.status }}
  explanation:
    description: 'Plain-language explanation of the score'
    value: ${{ steps.analyze.outputs.explanation }}

runs:
  using: 'composite'
  steps:
    - name: Run Deployment Guard Analysis
      id: analyze
      shell: bash
      run: bash "${GITHUB_ACTION_PATH}/scripts/analyze.sh"
      env:
        GUARD_API_KEY: ${{ inputs.api-key }}
        API_URL: ${{ inputs.api-url }}
        FAIL_OPEN: ${{ inputs.fail-open }}
        FAIL_ON_BLOCKED: ${{ inputs.fail-on-blocked }}
        INCIDENTS_7D: ${{ inputs.incidents-last-7d }}
        INCIDENTS_30D: ${{ inputs.incidents-last-30d }}
        TRIVY_CRITICAL_CVES: ${{ inputs.trivy-critical-cves }}
        TRIVY_HIGH_CVES: ${{ inputs.trivy-high-cves }}
        SEMGREP_FINDINGS: ${{ inputs.semgrep-findings }}
        SEMGREP_HIGH_SEVERITY: ${{ inputs.semgrep-high-severity }}
        CHECKOV_FAILED_CHECKS: ${{ inputs.checkov-failed-checks }}
        CHECKOV_CRITICAL_FAILURES: ${{ inputs.checkov-critical-failures }}
        GITHUB_REPO: ${{ github.repository }}
        GITHUB_BRANCH: ${{ github.ref_name }}
        GITHUB_SHA: ${{ github.sha }}
        GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        GITHUB_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        DIFF_CHANGED_PATHS: ${{ inputs.diff-changed-paths }}